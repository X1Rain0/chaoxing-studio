name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows / amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin\wails.exe'
          & $wails build -clean -platform windows/amd64
          if (-not (Test-Path 'build\bin\ChaoxingStudio.exe')) { throw '构建产物缺失' }
          Get-Item 'build\bin\ChaoxingStudio.exe' | ForEach-Object { "产物：$($_.FullName)  $([math]::Round($_.Length/1MB,2)) MB" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaoxingStudio-windows-amd64
          path: build/bin/ChaoxingStudio.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ChaoxingStudio.exe
          fail_on_unmatched_files: true
